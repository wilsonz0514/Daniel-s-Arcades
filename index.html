<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daniel's Number Arcade</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="previews.css">
  <link rel="stylesheet" href="font-theme.css">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="victory.css">
  <link rel="stylesheet" href="gameplay-upgrades.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" data-home aria-label="Go to arcade home">
      <span class="brand-mark">D</span>
      <span>NUMBER<br><b>ARCADE</b></span>
    </button>
    <div class="top-actions">
      <button class="wallet-btn" id="walletBtn" aria-label="Open rewards shop"><span>★</span> <b id="pointBalance">0</b> POINTS</button>
      <button class="shop-btn" id="shopBtn">SHOP</button>
      <button class="exit-btn" data-home>Quick Exit <span>×</span></button>
    </div>
  </header>

  <main>
    <section id="home" class="home-view view active">
      <div class="hero">
        <p class="eyebrow">WELCOME TO DANIEL'S ARCADE</p>
        <h1>THINK FAST.<br><em>PLAY SMART.</em></h1>
        <div class="scroll-cue"><span>↓</span> PICK A GAME</div>
      </div>

      <section class="games-section" aria-labelledby="games-title">
        <div class="section-heading">
          <div><h2 id="games-title">THE GAME ROOM</h2></div>
        </div>
        <div class="game-grid">
          <button class="game-card merge-card" data-game="merge">
            <div class="card-top"><span class="number">01</span><span class="play-circle">↗</span></div>
            <div class="art merge-art" aria-hidden="true">
              <div class="preview-score">GOAL <b>72+</b></div>
              <div class="mini-board">
                <span class="m3">3</span><span class="m5">5</span><span class="m7">7</span><span></span>
                <span></span><span class="m9 pulse-tile">9</span><span class="m9 pulse-tile delay">9</span><span></span>
                <span class="m6">6</span><span></span><span class="m18">18</span><span class="m14">14</span>
                <span></span><span class="m5">5</span><span class="m36">36</span><span></span>
              </div>
              <div class="merge-flash">9 + 9 = <b>?</b></div>
            </div>
            <div class="card-copy"><h3>MERGE<br>MAESTRO</h3><p>Combine tiles. Type the sum. One wrong move costs you.</p><span class="tag">QUICK MATH</span></div>
          </button>
          <button class="game-card multiples-card" data-game="multiples">
            <div class="card-top"><span class="number">02</span><span class="play-circle">↗</span></div>
            <div class="art bubble-art" aria-hidden="true">
              <div class="preview-level">LEVEL 6 / 10</div>
              <div class="target-ring"><small>FIND x</small><b>31</b></div>
              <span class="hit">62</span><span>79</span><span class="hit">93</span><span class="hit">124</span><span>117</span><span class="hit">186</span>
              <div class="scan-line"></div>
            </div>
            <div class="card-copy"><h3>MULTIPLE<br>HUNTER</h3><p>Spot every multiple before the clock runs out.</p><span class="tag">NUMBER SENSE</span></div>
          </button>
          <button class="game-card pattern-card" data-game="pattern">
            <div class="card-top"><span class="number">03</span><span class="play-circle">↗</span></div>
            <div class="art pattern-art" aria-hidden="true">
              <div class="level-chip">LEVEL 21 / 25</div>
              <div class="pattern-track advanced"><span class="shape circle coral small"></span><span class="shape triangle lime tilt"></span><span class="shape square violet"></span><span class="shape circle blue tilt small"></span><span class="shape triangle coral"></span><span class="shape mystery">?</span></div>
              <div class="progress-dots"><i></i><i></i><i></i><i></i><i></i><i></i></div>
            </div>
            <div class="card-copy"><h3>PATTERN<br>PULSE</h3><p>Read the sequence. Find what comes next. Keep climbing.</p><span class="tag">LOGIC</span></div>
          </button>
        </div>
      </section>
    </section>

    <section id="gameView" class="game-view view" aria-live="polite">
      <div class="game-header">
        <div><p class="eyebrow" id="gameKicker">GAME 01 / QUICK MATH</p><h2 id="gameTitle">MERGE MAESTRO</h2></div>
        <div class="scorebox"><small>SCORE</small><strong id="score">0</strong></div>
      </div>
      <div id="gameArea"></div>
    </section>

    <section id="shopView" class="shop-view view" aria-labelledby="shopTitle">
      <div class="shop-hero">
        <div><p class="eyebrow">SPEND WHAT YOU EARN</p><h2 id="shopTitle">POWER-UP SHOP</h2></div>
        <div class="shop-wallet"><small>YOUR BALANCE</small><strong><span>★</span> <b id="shopBalance">0</b></strong></div>
      </div>
      <div class="inventory-strip">
        <span>YOUR INVENTORY</span>
        <b>SKIPS <i id="skipCount">0</i></b>
        <b>ACCESSORIES <i id="accessoryCount">0 / 3</i></b>
      </div>
      <div class="shop-grid" id="shopGrid"></div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
</body>
</html>
